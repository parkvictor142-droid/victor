<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports · ictorv · Hotel Morgenstern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --onyx:#07090F; --night:#111A2E; --night-2:#18233C; --gold:#C9A55C; --gold-soft:rgba(201,165,92,.18);
    --pearl:#EFE6D2; --muted:#A79F8E; --line:rgba(239,230,210,.10); --alert:#E08A6B; --ok:#8FB59A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--onyx);color:var(--pearl);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.5}
  a{color:inherit}
  .shell{display:flex;min-height:100%}

  /* Sidebar */
  .side{width:250px;flex-shrink:0;background:var(--night);border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:40px}
  .brand svg{width:44px;height:44px}
  .brand b{font-family:Cinzel,serif;font-weight:600;letter-spacing:.22em;color:var(--gold);font-size:18px;display:block}
  .brand i{font-family:"Cormorant Garamond",serif;font-size:16px;color:var(--pearl)}
  .nav a{display:block;text-decoration:none;padding:11px 14px;margin-bottom:4px;border-left:2px solid transparent;color:var(--pearl);opacity:.82}
  .nav a:hover{opacity:1;background:rgba(255,255,255,.04)}
  .nav a.active{opacity:1;background:var(--night-2);border-left-color:var(--gold);font-weight:600}
  .nav a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .signout{margin-top:auto;background:none;border:0;color:var(--muted);font:inherit;text-align:left;padding:11px 14px;cursor:pointer;text-decoration:underline}

  /* Main */
  main{flex:1;padding:36px 44px 60px;max-width:1200px}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
  h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:44px;line-height:1;margin:0}
  .date{color:var(--muted);margin-top:8px}
  .btn{background:var(--gold);color:var(--onyx);border:0;padding:10px 18px;font:600 14px Montserrat,sans-serif;cursor:pointer;border-radius:3px}
  h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:24px;margin:0 0 14px}
  .panel{background:var(--night);border:1px solid var(--line);padding:22px 24px;border-radius:4px}
  .grid{display:grid;gap:20px;margin-top:20px}
  .g2{grid-template-columns:1fr 1fr}

  /* Hero: occupancy ring */
  .hero{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;padding:30px 34px}
  .ring{position:relative;width:200px;height:200px}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct{font-family:"Cormorant Garamond",serif;font-size:56px;line-height:1;color:var(--gold)}
  .ring .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:22px 28px}
  .fact .n{font-family:"Cormorant Garamond",serif;font-size:34px;line-height:1.1}
  .fact .l{color:var(--muted);font-size:13px}

  /* Lists & tables */
  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
  ul.list li:last-child{border-bottom:0}
  .room{color:var(--gold);white-space:nowrap}
  .empty{color:var(--muted);font-style:italic;font-family:"Cormorant Garamond",serif;font-size:18px}
  .sub-h{font-weight:600;font-size:13px;color:var(--muted);margin:16px 0 4px}
  .sub-h:first-of-type{margin-top:0}
  table{width:100%;border-collapse:collapse}
  th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:13px}
  th:first-child,td:first-child{text-align:left}
  tr:last-child td{border-bottom:0}
  .due{color:var(--alert);white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{border:1px solid var(--line);padding:10px 14px;border-radius:3px;min-width:110px}
  .chip .n{font-family:"Cormorant Garamond",serif;font-size:30px;line-height:1}
  .chip .l{color:var(--muted);font-size:13px;text-transform:capitalize}

  /* 7-day bars */
  .bars{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:end;height:170px}
  .bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
  .bar .track{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .bar .fill{width:100%;max-width:46px;background:var(--gold);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
  .bar.today .fill{opacity:1}
  .bar .p{font-size:13px}
  .bar .d{font-size:12px;color:var(--muted);text-align:center}

  .msg{padding:18px 22px;border:1px solid var(--alert);color:var(--pearl);border-radius:4px;margin-top:20px}
  .loading{color:var(--muted)}

  @media (max-width:900px){
    .shell{flex-direction:column}
    .side{width:auto;padding:16px;border-right:0;border-bottom:1px solid var(--line)}
    .brand{margin-bottom:12px}
    .nav{display:flex;overflow-x:auto;gap:4px}
    .nav a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}
    .nav a.active{border-bottom-color:var(--gold)}
    .signout{display:none}
    main{padding:24px 16px 48px}
    .g2{grid-template-columns:1fr}
    .hero{grid-template-columns:1fr;justify-items:center;padding:24px}
    h1{font-size:36px}
  }

  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .controls label{color:var(--muted);font-size:13px}
  input[type=month]{background:var(--night);color:var(--pearl);border:1px solid var(--line);padding:9px 12px;border-radius:3px;font:500 14px Montserrat,sans-serif;color-scheme:dark}
  .btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
  .total-row td{font-weight:600;border-top:1px solid var(--gold)}
  .days{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;align-items:end;height:160px}
  .day{display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center}
  .day .fill{width:100%;background:var(--gold);opacity:.85;border-radius:2px 2px 0 0;min-height:1px}
  .day .fill.zero{background:var(--line);opacity:1}
  .day-labels{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:6px}
  .day-labels span{font-size:11px;color:var(--muted);text-align:center}
  .scroll{overflow-x:auto}
  .scroll table{min-width:640px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="none" stroke="#C9A55C" stroke-width="1"/>
        <circle cx="24" cy="24" r="18" fill="none" stroke="#C9A55C" stroke-width=".6"/>
        <path d="M24 9 L26.5 21.5 L39 24 L26.5 26.5 L24 39 L21.5 26.5 L9 24 L21.5 21.5 Z" fill="#C9A55C"/>
      </svg>
      <div><b>ICTORV</b><i>Hotel Morgenstern</i></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <button class="signout" id="signout">Sign out</button>
  </aside>

  <main>
    <div class="top">
      <div>
        <h1>Financial reports</h1>
        <div class="date" id="period"></div>
      </div>
      <div class="controls">
        <label for="month">Month</label>
        <input type="month" id="month">
        <button class="btn ghost" id="csv">Download CSV</button>
      </div>
    </div>
    <div id="app"><p class="loading">Loading report…</p></div>
  </main>
</div>

<script>
/* ================= CONFIG — fill these in ================= */
// Copy these two lines from your dashboard.html.
const SUPABASE_URL = "https://blccrbiilztmothfrqqj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_r9Qrbyqg4lM3lpCo5C7vuw_AF8Fdl20";

const PAGES = [
  ["Room board",   "index.html"],
  ["Reservations", "index.html#res"],
  ["Check-in",     "index.html#checkin"],
  ["Invoices",     "index.html#inv"],
  ["Dashboard",    "dashboard.html"],
  ["Reports",      "reports.html"],
  ["Assistant",    "assistant.html"],
];
const SIGN_IN_PAGE = "index.html";
/* ========================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const eur = new Intl.NumberFormat("en-GB", { style: "currency", currency: "EUR" });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const day = (v) => String(v || "").slice(0, 10);
const DAY = 864e5;
const utc = (s) => Date.parse(s + "T00:00:00Z");
const isActive = (r) => !/cancel|storn|no.?show/i.test(r.status || "");
const isVoid = (inv) => /cancel|storn|void/i.test(inv.status || "");
const rateLabel = (v) => { const n = Number(v); return (n > 0 && n < 1 ? Math.round(n * 100) : n) + "%"; };
const METHODS = { girocard: "Girocard (EC)", visa: "Visa", mastercard: "Mastercard", cash: "Cash", invoice: "On account (bank transfer)", transfer: "Bank transfer" };

$("nav").innerHTML = PAGES.map(([label, href]) =>
  `<a href="${href}" class="${href === "reports.html" ? "active" : ""}">${label}</a>`).join("");
$("signout").onclick = async () => { await sb.auth.signOut(); location.href = SIGN_IN_PAGE; };

const now = new Date();
$("month").value = ymd(now).slice(0, 7);
$("month").onchange = load;
$("csv").onclick = downloadCsv;

let csvRows = [];

async function load() {
  const month = $("month").value || ymd(now).slice(0, 7);
  const [y, m] = month.split("-").map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const mStart = `${month}-01`;
  const mEnd = ymd(new Date(y, m, 1)); // first day of next month
  $("period").textContent = new Date(y, m - 1, 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" });

  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    $("app").innerHTML = `<div class="msg">You're signed out. <a href="${SIGN_IN_PAGE}">Sign in</a> to see reports.</div>`;
    return;
  }

  const q = await Promise.all([
    sb.from("rooms").select("number"),
    sb.from("reservations").select("id, booking_ref, guest_id, arrival, departure, nightly_rate, status"),
    sb.from("guests").select("id, first_name, last_name"),
    sb.from("invoices").select("id, invoice_number, reservation_id, issued_at, status"),
    sb.from("invoice_vat_summary").select("invoice_id, vat_rate, net, vat, gross"),
    sb.from("payments").select("invoice_id, amount, method, paid_at"),
  ]);
  const failed = q.find(r => r.error);
  if (failed) {
    $("app").innerHTML = `<div class="msg">Couldn't load data: ${esc(failed.error.message)}. Check the Supabase URL and key at the top of reports.html.</div>`;
    return;
  }
  const [rooms, res, guests, invoices, vatRows, payments] = q.map(r => r.data || []);
  const totalRooms = rooms.length || 1;
  const guestName = new Map(guests.map(g => [g.id, `${g.first_name ?? ""} ${g.last_name ?? ""}`.trim()]));
  const resById = new Map(res.map(r => [r.id, r]));

  // ---- Room nights, ADR, RevPAR for the month
  let roomNights = 0, roomRevenue = 0, stays = 0;
  res.filter(isActive).forEach(r => {
    const a = Math.max(utc(day(r.arrival)), utc(mStart));
    const b = Math.min(utc(day(r.departure)), utc(mEnd));
    const n = Math.round((b - a) / DAY);
    if (n > 0) { roomNights += n; roomRevenue += n * (Number(r.nightly_rate) || 0); }
    if (day(r.arrival) >= mStart && day(r.arrival) < mEnd) stays++;
  });
  const available = totalRooms * daysInMonth;
  const occPct = available ? roomNights / available * 100 : 0;
  const adr = roomNights ? roomRevenue / roomNights : 0;
  const revpar = available ? roomRevenue / available : 0;

  // ---- Invoices issued this month
  const monthInv = invoices.filter(i => !isVoid(i) && i.issued_at && ymd(new Date(i.issued_at)).startsWith(month))
    .sort((a, b) => String(a.issued_at).localeCompare(String(b.issued_at)));
  const invIds = new Set(monthInv.map(i => i.id));
  const rowsByInv = new Map();
  vatRows.forEach(v => { if (invIds.has(v.invoice_id)) { if (!rowsByInv.has(v.invoice_id)) rowsByInv.set(v.invoice_id, []); rowsByInv.get(v.invoice_id).push(v); } });

  // VAT breakdown by rate
  const byRate = new Map();
  rowsByInv.forEach(list => list.forEach(v => {
    const k = rateLabel(v.vat_rate);
    const s = byRate.get(k) || { net: 0, vat: 0, gross: 0 };
    s.net += Number(v.net || 0); s.vat += Number(v.vat || 0); s.gross += Number(v.gross || 0);
    byRate.set(k, s);
  }));
  const rates = [...byRate.keys()].sort((a, b) => parseFloat(a) - parseFloat(b));
  const tot = { net: 0, vat: 0, gross: 0 };
  byRate.forEach(s => { tot.net += s.net; tot.vat += s.vat; tot.gross += s.gross; });

  // Revenue by day (gross)
  const perDay = Array(daysInMonth).fill(0);
  monthInv.forEach(i => {
    const d = new Date(i.issued_at).getDate();
    (rowsByInv.get(i.id) || []).forEach(v => perDay[d - 1] += Number(v.gross || 0));
  });
  const maxDay = Math.max(...perDay, 1);

  // Payments by method (paid this month)
  const paidByInv = new Map();
  payments.forEach(p => paidByInv.set(p.invoice_id, (paidByInv.get(p.invoice_id) || 0) + Number(p.amount || 0)));
  const byMethod = new Map();
  payments.filter(p => p.paid_at && ymd(new Date(p.paid_at)).startsWith(month)).forEach(p => {
    const k = METHODS[p.method] || p.method || "Other";
    const s = byMethod.get(k) || { count: 0, amount: 0 };
    s.count++; s.amount += Number(p.amount || 0); byMethod.set(k, s);
  });
  const payTotal = [...byMethod.values()].reduce((s, x) => s + x.amount, 0);

  // Invoice list + CSV rows
  const invList = monthInv.map(i => {
    const list = rowsByInv.get(i.id) || [];
    const gross = list.reduce((s, v) => s + Number(v.gross || 0), 0);
    const net = list.reduce((s, v) => s + Number(v.net || 0), 0);
    const vatBy = {}; rates.forEach(r => vatBy[r] = 0);
    list.forEach(v => vatBy[rateLabel(v.vat_rate)] += Number(v.vat || 0));
    const paid = paidByInv.get(i.id) || 0;
    const r = resById.get(i.reservation_id);
    return { no: i.invoice_number, date: ymd(new Date(i.issued_at)), ref: r?.booking_ref || "", guest: guestName.get(r?.guest_id) || "",
             net, vatBy, gross, paid, due: Math.max(gross - paid, 0), status: i.status || "" };
  });
  csvRows = [
    ["Invoice number", "Issued", "Booking", "Guest", "Net", ...rates.map(r => `VAT ${r}`), "Gross", "Paid", "Due", "Status"],
    ...invList.map(x => [x.no, x.date, x.ref, x.guest, x.net.toFixed(2), ...rates.map(r => x.vatBy[r].toFixed(2)), x.gross.toFixed(2), x.paid.toFixed(2), x.due.toFixed(2), x.status]),
  ];

  const labelEvery = daysInMonth > 15 ? 5 : 1;
  $("app").innerHTML = `
    <section class="panel hero" style="grid-template-columns:1fr" aria-label="Month figures">
      <div class="facts">
        <div class="fact"><div class="n">${eur.format(tot.gross)}</div><div class="l">Invoiced (gross)</div></div>
        <div class="fact"><div class="n">${occPct.toFixed(1)}%</div><div class="l">Occupancy</div></div>
        <div class="fact"><div class="n">${roomNights}</div><div class="l">Room nights sold</div></div>
        <div class="fact"><div class="n">${eur.format(adr)}</div><div class="l">ADR (average rate)</div></div>
        <div class="fact"><div class="n">${eur.format(revpar)}</div><div class="l">RevPAR</div></div>
        <div class="fact"><div class="n">${stays}</div><div class="l">Arrivals this month</div></div>
      </div>
    </section>

    <div class="grid g2">
      <section class="panel">
        <h2>Revenue and VAT</h2>
        ${rates.length ? `<table>
          <thead><tr><th>VAT rate</th><th>Net</th><th>VAT</th><th>Gross</th></tr></thead>
          <tbody>
            ${rates.map(r => { const s = byRate.get(r); return `<tr><td>${r}</td><td>${eur.format(s.net)}</td><td>${eur.format(s.vat)}</td><td>${eur.format(s.gross)}</td></tr>`; }).join("")}
            <tr class="total-row"><td>Total</td><td>${eur.format(tot.net)}</td><td>${eur.format(tot.vat)}</td><td>${eur.format(tot.gross)}</td></tr>
          </tbody></table>` : `<p class="empty">No invoices issued this month</p>`}
      </section>
      <section class="panel">
        <h2>Payments by method</h2>
        ${byMethod.size ? `<table>
          <thead><tr><th>Method</th><th>Payments</th><th>Amount</th></tr></thead>
          <tbody>
            ${[...byMethod.entries()].sort((a, b) => b[1].amount - a[1].amount).map(([k, s]) => `<tr><td>${esc(k)}</td><td>${s.count}</td><td>${eur.format(s.amount)}</td></tr>`).join("")}
            <tr class="total-row"><td>Total</td><td>${[...byMethod.values()].reduce((s, x) => s + x.count, 0)}</td><td>${eur.format(payTotal)}</td></tr>
          </tbody></table>` : `<p class="empty">No payments received this month</p>`}
      </section>
    </div>

    <section class="panel" style="margin-top:20px">
      <h2>Revenue by day (gross)</h2>
      <div class="days">
        ${perDay.map((v, i) => `<div class="day" title="${i + 1}: ${eur.format(v)}"><div class="fill ${v ? "" : "zero"}" style="height:${v ? Math.max(v / maxDay * 100, 2) : 1}%"></div></div>`).join("")}
      </div>
      <div class="day-labels">
        ${perDay.map((_, i) => `<span>${(i + 1) % labelEvery === 0 || i === 0 ? i + 1 : ""}</span>`).join("")}
      </div>
    </section>

    <section class="panel" style="margin-top:20px">
      <h2>Invoices this month</h2>
      ${invList.length ? `<div class="scroll"><table>
        <thead><tr><th>Invoice</th><th>Date</th><th>Guest</th><th>Gross</th><th>Paid</th><th>Due</th></tr></thead>
        <tbody>
          ${invList.map(x => `<tr><td>${esc(x.no)}</td><td>${x.date.split("-").reverse().join(".")}</td><td>${esc(x.guest)}</td><td>${eur.format(x.gross)}</td><td>${eur.format(x.paid)}</td><td class="${x.due > 0.005 ? "due" : ""}">${eur.format(x.due)}</td></tr>`).join("")}
        </tbody></table></div>` : `<p class="empty">No invoices issued this month</p>`}
    </section>`;
}

function downloadCsv() {
  if (csvRows.length < 2) { alert("There are no invoices in this month to export."); return; }
  const cell = (v) => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const csv = csvRows.map(r => r.map(cell).join(",")).join("\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ictorv-report-${$("month").value}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

load();
</script>
</body>
</html>
