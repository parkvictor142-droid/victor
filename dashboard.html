<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · ictorv · Hotel Morgenstern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --onyx:#07090F; --night:#111A2E; --night-2:#18233C; --gold:#C9A55C; --gold-soft:rgba(201,165,92,.18);
    --pearl:#EFE6D2; --muted:#A79F8E; --line:rgba(239,230,210,.10); --alert:#E08A6B; --ok:#8FB59A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--onyx);color:var(--pearl);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.5}
  a{color:inherit}
  .shell{display:flex;min-height:100%}

  /* Sidebar */
  .side{width:250px;flex-shrink:0;background:var(--night);border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:40px}
  .brand svg{width:44px;height:44px}
  .brand b{font-family:Cinzel,serif;font-weight:600;letter-spacing:.22em;color:var(--gold);font-size:18px;display:block}
  .brand i{font-family:"Cormorant Garamond",serif;font-size:16px;color:var(--pearl)}
  .nav a{display:block;text-decoration:none;padding:11px 14px;margin-bottom:4px;border-left:2px solid transparent;color:var(--pearl);opacity:.82}
  .nav a:hover{opacity:1;background:rgba(255,255,255,.04)}
  .nav a.active{opacity:1;background:var(--night-2);border-left-color:var(--gold);font-weight:600}
  .nav a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .signout{margin-top:auto;background:none;border:0;color:var(--muted);font:inherit;text-align:left;padding:11px 14px;cursor:pointer;text-decoration:underline}

  /* Main */
  main{flex:1;padding:36px 44px 60px;max-width:1200px}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
  h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:44px;line-height:1;margin:0}
  .date{color:var(--muted);margin-top:8px}
  .btn{background:var(--gold);color:var(--onyx);border:0;padding:10px 18px;font:600 14px Montserrat,sans-serif;cursor:pointer;border-radius:3px}
  h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:24px;margin:0 0 14px}
  .panel{background:var(--night);border:1px solid var(--line);padding:22px 24px;border-radius:4px}
  .grid{display:grid;gap:20px;margin-top:20px}
  .g2{grid-template-columns:1fr 1fr}

  /* Hero: occupancy ring */
  .hero{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;padding:30px 34px}
  .ring{position:relative;width:200px;height:200px}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct{font-family:"Cormorant Garamond",serif;font-size:56px;line-height:1;color:var(--gold)}
  .ring .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:22px 28px}
  .fact .n{font-family:"Cormorant Garamond",serif;font-size:34px;line-height:1.1}
  .fact .l{color:var(--muted);font-size:13px}

  /* Lists & tables */
  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
  ul.list li:last-child{border-bottom:0}
  .room{color:var(--gold);white-space:nowrap}
  .empty{color:var(--muted);font-style:italic;font-family:"Cormorant Garamond",serif;font-size:18px}
  .sub-h{font-weight:600;font-size:13px;color:var(--muted);margin:16px 0 4px}
  .sub-h:first-of-type{margin-top:0}
  table{width:100%;border-collapse:collapse}
  th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:13px}
  th:first-child,td:first-child{text-align:left}
  tr:last-child td{border-bottom:0}
  .due{color:var(--alert);white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{border:1px solid var(--line);padding:10px 14px;border-radius:3px;min-width:110px}
  .chip .n{font-family:"Cormorant Garamond",serif;font-size:30px;line-height:1}
  .chip .l{color:var(--muted);font-size:13px;text-transform:capitalize}

  /* 7-day bars */
  .bars{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:end;height:170px}
  .bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
  .bar .track{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .bar .fill{width:100%;max-width:46px;background:var(--gold);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
  .bar.today .fill{opacity:1}
  .bar .p{font-size:13px}
  .bar .d{font-size:12px;color:var(--muted);text-align:center}

  .msg{padding:18px 22px;border:1px solid var(--alert);color:var(--pearl);border-radius:4px;margin-top:20px}
  .loading{color:var(--muted)}

  @media (max-width:900px){
    .shell{flex-direction:column}
    .side{width:auto;padding:16px;border-right:0;border-bottom:1px solid var(--line)}
    .brand{margin-bottom:12px}
    .nav{display:flex;overflow-x:auto;gap:4px}
    .nav a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}
    .nav a.active{border-bottom-color:var(--gold)}
    .signout{display:none}
    main{padding:24px 16px 48px}
    .g2{grid-template-columns:1fr}
    .hero{grid-template-columns:1fr;justify-items:center;padding:24px}
    h1{font-size:36px}
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="none" stroke="#C9A55C" stroke-width="1"/>
        <circle cx="24" cy="24" r="18" fill="none" stroke="#C9A55C" stroke-width=".6"/>
        <path d="M24 9 L26.5 21.5 L39 24 L26.5 26.5 L24 39 L21.5 26.5 L9 24 L21.5 21.5 Z" fill="#C9A55C"/>
      </svg>
      <div><b>ICTORV</b><i>Hotel Morgenstern</i></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <button class="signout" id="signout">Sign out</button>
  </aside>

  <main>
    <div class="top">
      <div>
        <h1>Dashboard</h1>
        <div class="date" id="today"></div>
      </div>
      <button class="btn" id="refresh">Refresh</button>
    </div>
    <div id="app"><p class="loading">Loading hotel data…</p></div>
  </main>
</div>

<script>
/* ================= CONFIG — fill these in ================= */
// Copy both values from your invoices.html (or Supabase → Connect).
const SUPABASE_URL = "https://blccrbiilztmothfrqqj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_r9Qrbyqg4lM3lpCo5C7vuw_AF8Fdl20";

// Your page file names. Change them if yours are named differently.
const PAGES = [
  ["Room board",   "index.html"],
  ["Reservations", "index.html#res"],
  ["Check-in",     "index.html#checkin"],
  ["Invoices",     "index.html#inv"],
  ["Dashboard",    "dashboard.html"],
  ["Reports",       "reports.html"],
  ["Assistant",    "assistant.html"],
];
const SIGN_IN_PAGE = "index.html";
/* ========================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const eur = new Intl.NumberFormat("en-GB", { style: "currency", currency: "EUR" });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const day = (v) => String(v || "").slice(0, 10);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const isActive = (r) => !/cancel|storn|no.?show/i.test(r.status || "");
const isVoid = (inv) => /cancel|storn|void/i.test(inv.status || "");
const inHouseOn = (r, d) => isActive(r) && r.status !== "checked_out" && day(r.arrival) <= d && day(r.departure) > d;

// Sidebar
$("nav").innerHTML = PAGES.map(([label, href]) =>
  `<a href="${href}" class="${href === "dashboard.html" ? "active" : ""}">${label}</a>`).join("");
$("signout").onclick = async () => { await sb.auth.signOut(); location.href = SIGN_IN_PAGE; };
$("refresh").onclick = load;

async function load() {
  const now = new Date();
  const today = ymd(now);
  const month = today.slice(0, 7);
  $("today").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    $("app").innerHTML = `<div class="msg">You're signed out. <a href="${SIGN_IN_PAGE}">Sign in</a> to see the dashboard.</div>`;
    return;
  }

  const q = await Promise.all([
    sb.from("rooms").select("number, room_type, status"),
    sb.from("reservations").select("id, booking_ref, guest_id, room_number, arrival, departure, adults, children, nightly_rate, status"),
    sb.from("guests").select("id, first_name, last_name"),
    sb.from("registration_forms").select("reservation_id"),
    sb.from("invoices").select("id, invoice_number, reservation_id, issued_at, status"),
    sb.from("invoice_vat_summary").select("invoice_id, vat_rate, net, vat, gross"),
    sb.from("payments").select("invoice_id, amount"),
  ]);
  const failed = q.find(r => r.error);
  if (failed) {
    $("app").innerHTML = `<div class="msg">Couldn't load data: ${esc(failed.error.message)}. Check the Supabase URL and key at the top of dashboard.html.</div>`;
    return;
  }
  const [rooms, res, guests, forms, invoices, vatRows, payments] = q.map(r => r.data || []);

  const guestName = new Map(guests.map(g => [g.id, `${g.first_name ?? ""} ${g.last_name ?? ""}`.trim()]));
  const resById = new Map(res.map(r => [r.id, r]));
  const nameOf = (r) => esc(guestName.get(r?.guest_id) || "Guest");
  const totalRooms = rooms.length || 1;

  // Tonight
  const inHouse = res.filter(r => inHouseOn(r, today));
  const occupied = new Set(inHouse.map(r => r.room_number)).size;
  const occPct = Math.round(occupied / totalRooms * 100);
  const arrivals = res.filter(r => isActive(r) && day(r.arrival) === today);
  const departures = res.filter(r => isActive(r) && day(r.departure) === today);
  const guestsInHouse = inHouse.reduce((s, r) => s + (Number(r.adults) || 0) + (Number(r.children) || 0), 0);
  const roomRevenue = inHouse.reduce((s, r) => s + (Number(r.nightly_rate) || 0), 0);
  const adr = inHouse.length ? roomRevenue / inHouse.length : 0;
  const revpar = roomRevenue / totalRooms;

  // Room status
  const statusCount = {};
  rooms.forEach(r => { const k = (r.status || "unknown").replace(/_/g, " "); statusCount[k] = (statusCount[k] || 0) + 1; });

  // Revenue from invoices
  const validInv = invoices.filter(i => !isVoid(i));
  const validIds = new Set(validInv.map(i => i.id));
  const invDay = new Map(validInv.map(i => [i.id, i.issued_at ? ymd(new Date(i.issued_at)) : ""]));
  const sums = { today: { net: 0, vat: 0, gross: 0 }, month: { net: 0, vat: 0, gross: 0 } };
  const grossByInv = new Map();
  vatRows.forEach(v => {
    if (!validIds.has(v.invoice_id)) return;
    const d = invDay.get(v.invoice_id);
    grossByInv.set(v.invoice_id, (grossByInv.get(v.invoice_id) || 0) + Number(v.gross || 0));
    for (const [key, ok] of [["today", d === today], ["month", d.startsWith(month)]]) {
      if (!ok) continue;
      sums[key].net += Number(v.net || 0); sums[key].vat += Number(v.vat || 0); sums[key].gross += Number(v.gross || 0);
    }
  });

  // Open invoices
  const paidByInv = new Map();
  payments.forEach(p => paidByInv.set(p.invoice_id, (paidByInv.get(p.invoice_id) || 0) + Number(p.amount || 0)));
  const openInv = validInv
    .map(i => ({ ...i, due: (grossByInv.get(i.id) || 0) - (paidByInv.get(i.id) || 0) }))
    .filter(i => i.due > 0.005);

  // Checked-in guests without a Meldeschein
  const formSet = new Set(forms.map(f => f.reservation_id));
  const noForm = inHouse.filter(r => !formSet.has(r.id));

  // Next 7 days
  const week = [...Array(7)].map((_, i) => {
    const d = addDays(now, i), key = ymd(d);
    const occ = new Set(res.filter(r => inHouseOn(r, key)).map(r => r.room_number)).size;
    return { label: d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric" }), pct: Math.round(occ / totalRooms * 100), today: i === 0 };
  });

  const C = 2 * Math.PI * 88;
  const list = (rows, fn, empty) => rows.length ? `<ul class="list">${rows.map(fn).join("")}</ul>` : `<p class="empty">${empty}</p>`;

  $("app").innerHTML = `
    <section class="panel hero" aria-label="Tonight">
      <div class="ring">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="88" fill="none" stroke="var(--gold-soft)" stroke-width="10"/>
          <circle cx="100" cy="100" r="88" fill="none" stroke="var(--gold)" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - occPct / 100)}"/>
        </svg>
        <div class="val"><div class="pct">${occPct}%</div><div class="sub">${occupied} of ${rooms.length} rooms booked tonight</div></div>
      </div>
      <div class="facts">
        <div class="fact"><div class="n">${arrivals.length}</div><div class="l">Arrivals today</div></div>
        <div class="fact"><div class="n">${departures.length}</div><div class="l">Departures today</div></div>
        <div class="fact"><div class="n">${guestsInHouse}</div><div class="l">Guests in house</div></div>
        <div class="fact"><div class="n">${eur.format(adr)}</div><div class="l">ADR (average rate)</div></div>
        <div class="fact"><div class="n">${eur.format(revpar)}</div><div class="l">RevPAR</div></div>
        <div class="fact"><div class="n">${eur.format(roomRevenue)}</div><div class="l">Room revenue tonight</div></div>
      </div>
    </section>

    <div class="grid g2">
      <section class="panel">
        <h2>Today's movements</h2>
        <div class="sub-h">Arriving</div>
        ${list(arrivals, r => `<li><span>${nameOf(r)}</span><span class="room">Room ${esc(r.room_number)}</span></li>`, "No arrivals today")}
        <div class="sub-h">Departing</div>
        ${list(departures, r => `<li><span>${nameOf(r)}</span><span class="room">Room ${esc(r.room_number)}</span></li>`, "No departures today")}
      </section>
      <section class="panel">
        <h2>Room status</h2>
        <div class="chips">
          ${Object.entries(statusCount).map(([k, n]) => `<div class="chip"><div class="n">${n}</div><div class="l">${esc(k)}</div></div>`).join("") || '<p class="empty">No rooms found</p>'}
        </div>
      </section>
    </div>

    <div class="grid g2">
      <section class="panel">
        <h2>Revenue</h2>
        <table>
          <thead><tr><th></th><th>Net</th><th>VAT</th><th>Gross</th></tr></thead>
          <tbody>
            <tr><td>Today</td><td>${eur.format(sums.today.net)}</td><td>${eur.format(sums.today.vat)}</td><td>${eur.format(sums.today.gross)}</td></tr>
            <tr><td>This month</td><td>${eur.format(sums.month.net)}</td><td>${eur.format(sums.month.vat)}</td><td>${eur.format(sums.month.gross)}</td></tr>
          </tbody>
        </table>
      </section>
      <section class="panel">
        <h2>Needs attention</h2>
        <div class="sub-h">Unpaid invoices</div>
        ${list(openInv, i => `<li><span>${esc(i.invoice_number)} · ${nameOf(resById.get(i.reservation_id))}</span><span class="due">${eur.format(i.due)} due</span></li>`, "All invoices are paid")}
        <div class="sub-h">In house without Meldeschein</div>
        ${list(noForm, r => `<li><span>${nameOf(r)}</span><span class="room">Room ${esc(r.room_number)}</span></li>`, "Every guest has a Meldeschein")}
      </section>
    </div>

    <section class="panel grid" style="margin-top:20px">
      <h2 style="margin:0">Occupancy, next 7 days</h2>
      <div class="bars">
        ${week.map(w => `<div class="bar ${w.today ? "today" : ""}"><span class="p">${w.pct}%</span><div class="track"><div class="fill" style="height:${Math.max(w.pct, 1)}%"></div></div><span class="d">${w.label}</span></div>`).join("")}
      </div>
    </section>`;
}

load();
</script>
</body>
</html>
